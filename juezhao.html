*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f6f3ec;font-family:'Noto Serif SC','Songti SC',serif;}
.poster{width:540px;height:960px;background:#f6f3ec;color:#2f2a26;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:54px 44px 46px;position:relative;overflow:hidden;}
.poster::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;

.seal{position:absolute;top:46px;right:44px;width:58px;height:58px;border:2px solid #b5542d;
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:#b5542d;font-size:15px;font-weight:700;letter-spacing:2px;line-height:1.1;
  writing-mode:vertical-rl;text-align:center;opacity:.9;}
.kicker{font-size:13px;letter-spacing:6px;color:#b5542d;font-weight:600;}
.h1{font-size:60px;font-weight:800;letter-spacing:14px;color:#2f2a26;margin-top:10px;}
.sub{font-size:17px;letter-spacing:3px;color:#6b6259;margin-top:12px;}
.rule{width:46px;height:3px;background:#b5542d;margin:18px 0;border-radius:2px;}
.box{border-left:3px solid #b5542d;padding:14px 0 14px 18px;
  font-size:16.5px;line-height:1.8;color:#2f2a26;background:rgba(181,84,45,.04);}
.box b{color:#b5542d;font-weight:700;}
.note{font-size:14px;color:#6b6259;line-height:1.9;}
.cta{text-align:center;border:1px solid #2f2a26;border-radius:999px;
  padding:14px;font-size:15px;letter-spacing:2px;color:#2f2a26;background:rgba(47,42,38,.03);}
.cta b{color:#b5542d;font-weight:700;}
.sign{text-align:center;font-size:13px;color:#6b6259;letter-spacing:3px;}
.foot{display:flex;flex-direction:column;gap:16px;}
/* 主视觉 · 痛点钩子 */
.hooks{background:rgba(181,84,45,.05);border-radius:10px;padding:16px 18px;}
.hk-t{font-size:13px;letter-spacing:3px;color:#b5542d;font-weight:700;margin-bottom:9px;}
.hk{font-size:13.5px;color:#4a423a;line-height:1.95;}
.poster > *:not(.wm):not(.seal){position:relative;z-index:1;}
.wm{position:absolute;right:-34px;bottom:56px;font-size:270px;font-weight:800;
  color:rgba(181,84,45,.045);line-height:1;z-index:0;pointer-events:none;user-select:none;
  font-family:'Noto Serif SC','Songti SC',serif;}

/* 主视觉 */
.lead-quote{font-size:18px;line-height:1.85;color:#2f2a26;margin-top:6px;}
/* 我能带你做 · 卡片 */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card{background:#fffdf8;border:1px solid #e3ddd0;border-radius:10px;padding:18px 16px;
  box-shadow:0 6px 16px rgba(47,42,38,.06);}
.card h3{font-size:17px;color:#b5542d;letter-spacing:2px;margin-bottom:8px;}
.card p{font-size:13px;color:#6b6259;line-height:1.75;}
.sec-title{font-size:22px;letter-spacing:5px;color:#2f2a26;margin-bottom:6px;}
.sec-title::before{content:"";display:inline-block;width:9px;height:9px;background:#b5542d;
  margin-right:12px;vertical-align:middle;}
/* 找到我 */
.contact{display:flex;gap:22px;align-items:center;}
.qr-card{width:168px;height:168px;flex-shrink:0;background:#fff;border:6px solid #fff;
  outline:1px solid #e3ddd0;border-radius:8px;box-shadow:0 8px 20px rgba(47,42,38,.12);}
.qr-card img{width:100%;height:100%;display:block;border-radius:3px;}
.c-list{list-style:none;font-size:15.5px;line-height:2;}
.c-list li{margin-bottom:8px;color:#2f2a26;}
.c-list b{color:#b5542d;font-weight:600;margin-right:10px;letter-spacing:1px;}
/* 觉照金句 */
.zen-wrap{display:flex;flex-direction:column;justify-content:center;flex:1;padding:0 4px;}
.zen-quote{font-size:32px;line-height:1.9;color:#2f2a26;text-align:center;letter-spacing:2px;}
.zen-quote em{color:#b5542d;font-style:normal;}
.zen-mark{text-align:center;font-size:14px;color:#b5542d;letter-spacing:4px;margin-top:28px;}
/* 卡点·痛点 */
.pain-list{display:flex;flex-direction:column;gap:19px;}
.pain{background:#fffdf8;border:1px solid #e3ddd0;border-left:3px solid #b5542d;border-radius:8px;
  padding:19px 21px;box-shadow:0 4px 12px rgba(47,42,38,.05);}
.pain .pt{font-size:16.5px;line-height:1.5;color:#2f2a26;font-weight:700;}
.pain .pt .x{color:#b5542d;margin-right:7px;}
.pain .sol{font-size:13.5px;line-height:1.65;color:#6b6259;margin-top:9px;}
.pain .sol .ok{color:#5c7a52;font-weight:700;margin-right:7px;}

/* 顶部文案 */
.zen-head{padding-top:4px;}
.zh-title{font-size:27px;font-weight:800;letter-spacing:3px;color:#2f2a26;line-height:1.5;}
.zh-title em{font-style:normal;color:#b5542d;}
.zh-sub{margin-top:10px;font-size:14.5px;line-height:1.95;color:#6b6259;letter-spacing:1.5px;}
/* 插图 */
.figure{border-radius:10px;overflow:hidden;border:1px solid #e3ddd0;
  box-shadow:0 8px 22px rgba(47,42,38,.10);margin:26px auto 0;max-width:400px;}
.figure img{width:100%;display:block;}
/* 内容变高：解除本页海报 960px 固定高度 */
.page.poster-page .poster{height:auto;padding-bottom:26px;}
/* === 站点统一：移动端缩放（与其他海报页一致） === */
.poster{width:540px !important;}
.stage{width:540px;margin:0 auto;}
.page.poster-page{display:block;padding:40px 0 60px;background:#f6f3ec;min-height:100vh;}
.back-btn{position:fixed;top:14px;left:14px;z-index:999;background:#b5542d;color:#fffdf8;font-family:inherit;font-size:13px;padding:7px 14px;border-radius:999px;text-decoration:none;letter-spacing:1px;box-shadow:0 4px 12px rgba(47,42,38,.2);}
.site-foot{text-align:center;font-size:12px;color:#6b6259;padding:24px 16px 40px;letter-spacing:1px;border-top:1px solid #e7e0d2;margin-top:10px;}
.site-foot a{color:#b5542d;text-decoration:none;margin:0 4px;}
@media (max-width:600px){
  html,body{overflow-x:hidden;}
  .page.poster-page{display:block;justify-content:flex-start;padding:0;height:auto;overflow:hidden;}
  .stage{width:100%;}
  .poster{position:relative;left:calc((100% - 540px)/2);transform:scale(var(--s));transform-origin:top center;}
  .g{padding-right:96px !important;}
  :root{--s:0.69;}
}

<style>

/* ═══ 设计令牌 · 宋式美学 ═══ */
:root{
  --paper:#FAF8F3; --paper-2:#F3EFE5; --paper-3:#EDE8DC;
  --ink:#211F1D; --ink-2:#4A4640; --ink-3:#8B857A;
  --cinnabar:#B04A37; --cinnabar-d:#8E3A2B;
  --daiqing:#46626F; --celadon:#7C8B7A;
  --line:#E4DED2; --line-2:#D5CEBF;
  --font-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,"SimSun",serif;
  --font-sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
body{ font-family:var(--font-serif) !important; }

body{ background:linear-gradient(180deg,#FAF8F3 0%,#F3EFE5 100%) !important; }
.page.poster-page{
  background:linear-gradient(180deg,#FAF8F3 0%,#F3EFE5 100%) !important;
  padding:clamp(16px,4vw,40px) 0 clamp(24px,5vw,48px) !important;
  height:auto !important; min-height:0 !important; overflow:visible !important;
}
/* 定宽 + scale() → 流式（小屏不再整体缩字） */
.stage{ width:100% !important; max-width:540px !important; margin:0 auto !important; transform:none !important; }
.poster{
  width:100% !important; max-width:540px !important;
  height:auto !important; min-height:0 !important;
  padding:clamp(22px,5.5vw,54px) clamp(18px,5vw,44px) clamp(22px,5vw,46px) !important;

}
.poster.w660{ max-width:660px !important; }

.rule-top{background:var(--cinnabar) !important;}

/* 配色：朱砂强调 + 黛青辅助 */
.seal{border-color:var(--cinnabar) !important; color:var(--cinnabar) !important; border-radius:5px !important;}
.rule{background:var(--cinnabar) !important;}
.poster::before{background:linear-gradient(90deg,transparent,var(--cinnabar) 40%,var(--daiqing) 60%,transparent) !important;}

.step .n{background:var(--cinnabar) !important;}
.card h3,.module .name{color:var(--cinnabar) !important;}
.no,.num,.n{font-family:var(--font-sans) !important;}

.card,.pain,.step,.module,.figure,.qr-card,.hooks,.deliverables,.upgrade{border-radius:10px !important;}
.card,.pain,.step,.module{
  box-shadow:0 6px 18px rgba(33,31,29,.06) !important;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease) !important;
}
.card:hover,.pain:hover,.step:hover,.module:hover{
  transform:translateY(-4px) !important;
  box-shadow:0 14px 30px rgba(33,31,29,.10) !important;
  border-color:var(--line-2) !important;
}
.figure img,.hero-img{border-radius:8px !important;}
/* 落款呼吸（防贴靠） */
.sign,.foot{margin-top:clamp(28px,6vw,48px) !important;}
.poster > .sign:last-child{margin-bottom:0 !important;}

/* 顶栏 / 页脚 */
.back-btn{font-family:var(--font-sans) !important; border-radius:999px !important; transition:opacity .2s var(--ease),transform .2s var(--ease) !important;}
.back-btn:hover{opacity:.9 !important; transform:translateX(-2px) !important;}
.site-foot{font-family:var(--font-sans) !important; color:var(--ink-3) !important; letter-spacing:.1em !important;}
.site-foot a{color:var(--cinnabar) !important; transition:opacity .2s var(--ease) !important;}
.site-foot a:hover{opacity:.7 !important;}

/* 滚动淡入 */
[data-reveal]{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
[data-reveal].in{opacity:1;transform:none;}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important;}
  [data-reveal]{opacity:1;transform:none;}
}

.contact{flex-wrap:wrap !important; gap:clamp(14px,4vw,22px) !important;}

<script data-sgw="sgwRevealJS">
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 自动标记内容块（排除绝对定位装饰 .seal/.wm） */
  var sel = '.g,.bio,.contact,.figure,.hero-img,.cards,.steps,.pain-list,.vs-row,.zen-head,.zen-wrap,.hooks,.box,.cta,.modules,.deliverables,.upgrade,.price-area,.card,.pain,.step,.module,.form-card,.intro,.sec-title';
  var els = [];
  document.querySelectorAll(sel).forEach(function(el){
    if (el.closest('.seal,.wm')) return;
    els.push(el);
  });
  if (reduce || !('IntersectionObserver' in window)) {
    els.forEach(function(el){ el.classList.add('in'); });
    return;
  }
  els.forEach(function(el){ el.setAttribute('data-reveal',''); });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold:.10, rootMargin:'0px 0px -30px 0px' });
  els.forEach(function(el,i){
    el.style.transitionDelay = Math.min(i*55, 400) + 'ms';
    io.observe(el);
  });
})();
</script>
